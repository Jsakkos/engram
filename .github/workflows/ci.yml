name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merge queue: GitHub builds a temporary `gh-readonly-queue/main/...` branch
  # (the PR squashed onto the latest main) and waits for the required "CI Gate"
  # check on it before landing. Without this trigger a queued PR waits forever.
  merge_group:
    types: [checks_requested]
  # Weekly full run, path filters off. The dependency-resolution matrix only
  # runs on PRs that touch the dependency set, but a new upstream release (a
  # wheel dropped for a platform, a new interpreter) breaks resolution without
  # any change here; this is what notices.
  schedule:
    - cron: "41 4 * * 1" # Mondays 04:41 UTC
  workflow_dispatch:

# The repo default is already read-only; stated here so a later change to that
# setting cannot hand every CI job a write token.
permissions:
  contents: read

# PRs: a new push supersedes the old run, so cancel it. Everything else (main
# pushes, merge-queue entries, the weekly run) gets a group of its own and is
# never cancelled: `main` does not require up-to-date branches, so CI on main is
# the only place two individually-green PRs are tested together, and each
# commit needs its own result to bisect a break.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Opt JS actions still pinned to Node 20 (e.g. actions/cache/restore@v4 used
  # transitively by astral-sh/setup-uv) into the Node 24 runtime now, ahead of
  # GitHub's June 2026 forced cutover. See:
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Pinned so a uv release cannot change CI behaviour under an unrelated PR.
  # Renovate bumps it (customManagers:githubActionsVersions reads the comment).
  # renovate: datasource=github-releases depName=astral-sh/uv
  UV_VERSION: "0.13.9"
  # renovate: datasource=pypi depName=actionlint-py
  ACTIONLINT_VERSION: "1.7.12.25"
  # renovate: datasource=pypi depName=shellcheck-py
  SHELLCHECK_VERSION: "0.11.0.1"

jobs:
  # Decide whether this is a release-only change (a `chore: release vX.Y.Z` PR
  # that touches nothing but version strings + CHANGELOG.md). When it is, the
  # heavy behavioral jobs below are skipped — the released code was already
  # validated when its source PRs merged, and release.yml does the real binary
  # validation. The detection keys on a release SIGNAL (title + a strict file
  # allowlist), NEVER on paths alone, so a Renovate lock-file bump (which also
  # touches uv.lock / package-lock.json but is titled `chore(deps):`) still runs
  # the full suite. See docs/superpowers/specs for the design.
  detect-release:
    name: Detect Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      is_release: ${{ steps.detect.outputs.is_release }}
      os_matrix: ${{ steps.detect.outputs.os_matrix }}
      build_relevant: ${{ steps.detect.outputs.build_relevant }}
      deps_changed: ${{ steps.detect.outputs.deps_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # need base history for the changed-file diff
      - id: detect
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          # push: the head commit; merge_group: the queue's squash commit, whose
          # subject is the PR title, so the `chore: release v` match still works.
          HEAD_MSG: ${{ github.event.head_commit.message || github.event.merge_group.head_commit.message }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          # Clamp to the first line: head_commit.message carries the full body,
          # and `grep '^'` matches the start of EVERY line, so a body line that
          # begins `chore: release v` could false-positive. We only want to key
          # on the commit subject (PR titles are already single-line).
          title=$(printf '%s' "${PR_TITLE:-$HEAD_MSG}" | head -n1)
          echo "event=$EVENT_NAME title=$title"

          # Changed-file list, computed ONCE and consumed by the release
          # detection and both path filters below. diff_ok tracks whether we
          # actually got one: on a first push to a new branch,
          # github.event.before is all-zeros and the diff cannot resolve.
          diff_ok=true
          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE_SHA"; head="$PR_HEAD_SHA" ;;
            merge_group)
              # There is no PR payload and no `before` SHA here; without this the
              # diff would fail and fail-safe into running the path-filtered jobs.
              base="$MG_BASE_SHA"; head="$MG_HEAD_SHA" ;;
            push)
              base="$PUSH_BEFORE"; head="$PUSH_AFTER" ;;
            *)
              # schedule / workflow_dispatch: a full run on purpose, so no diff
              # and every path-filtered job runs (the fail-safe branch below).
              echo "$EVENT_NAME run: path filters off."
              diff_ok=false ;;
          esac
          changed=""
          if [ "$diff_ok" = "true" ]; then
            changed=$(git diff --name-only "$base" "$head" 2>/dev/null) || diff_ok=false
          fi
          echo "diff_ok=$diff_ok"
          echo "changed files:"; printf '%s\n' "$changed"

          is_release=false
          if printf '%s' "$title" | grep -qE '^chore: release v[0-9]'; then
            allow='^(backend/pyproject\.toml|backend/app/__init__\.py|backend/uv\.lock|frontend/package\.json|frontend/package-lock\.json|CHANGELOG\.md)$'
            # release-only iff there IS a diff AND no changed file is outside the allowlist
            if [ "$diff_ok" = "true" ] && [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE "$allow"; then
              is_release=true
            else
              echo "Title says release but diff is empty or includes non-allowlisted files, running full CI."
            fi
          fi

          # A path filter answers "did anything that can matter move?". An
          # unusable diff means RUN, never silently skip.
          path_filter() {
            if [ "$diff_ok" != "true" ]; then
              echo true
            elif printf '%s\n' "$changed" | grep -qE "$1"; then
              echo true
            else
              echo false
            fi
          }

          # Path filter for the frozen-build gate. Building + booting the
          # PyInstaller bundle costs ~5 min, so it runs only when something that
          # can plausibly change what gets bundled moved: the dependency set, the
          # spec, or the bundled-binary fetcher. That is the case that motivated
          # the gate (a scipy bump in a Renovate PR relocated a vendored module
          # and silently broke every release binary while CI stayed green). The
          # gate's own files are listed too, so a PR editing it exercises it.
          #
          # This deliberately fires on `chore: release` PRs as well: they touch
          # uv.lock + pyproject, and a release PR is exactly when a working
          # binary matters most. It is the one heavy job release PRs keep.
          build_relevant=$(path_filter '^(backend/uv\.lock|backend/pyproject\.toml|backend/engram\.spec|backend/scripts/fetch_fpcalc\.py|backend/scripts/smoke_test_frozen\.sh|\.github/workflows/ci\.yml|\.github/actions/setup-backend/action\.yml)$')

          # Path filter for the dependency-resolution matrix (3 of its 6 legs
          # are macOS, the scarcest runners). Only the dependency set or this
          # workflow can change what `uv sync` resolves from our side; upstream
          # changes are caught by the weekly scheduled run.
          deps_changed=$(path_filter '^(backend/uv\.lock|backend/pyproject\.toml|\.github/workflows/ci\.yml)$')

          if [ "$is_release" = "true" ]; then
            os_matrix='["ubuntu-latest"]'
          else
            os_matrix='["ubuntu-latest","windows-latest"]'
          fi
          {
            echo "is_release=$is_release"
            echo "os_matrix=$os_matrix"
            echo "build_relevant=$build_relevant"
            echo "deps_changed=$deps_changed"
          } >> "$GITHUB_OUTPUT"
          echo "RESULT is_release=$is_release os_matrix=$os_matrix build_relevant=$build_relevant deps_changed=$deps_changed"

  changelog-version-check:
    name: Changelog Version Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      # The GitHub release body is generated from the matching CHANGELOG.md
      # section (see release.yml), so a `chore: release vX.Y.Z` PR must ship its
      # changelog entry. This fails such a PR fast — before the ~20-min binary
      # build — when the section is missing. Normal PRs pass trivially (pyproject
      # is still the last released version, whose section already exists).
      - name: CHANGELOG has a section for the pyproject version
        run: |
          VERSION=$(grep '^version = ' backend/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "pyproject version: $VERSION"
          python3 backend/scripts/extract_changelog.py \
            --version "$VERSION" --changelog CHANGELOG.md --check

  # actionlint type-checks every workflow (expressions, contexts, needs:, job
  # outputs) and runs shellcheck over each `run:` block. ci.yml alone carries a
  # few hundred lines of embedded bash, which nothing else checks.
  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - name: actionlint (with shellcheck)
        run: |
          uvx --with "shellcheck-py==${SHELLCHECK_VERSION}" \
            --from "actionlint-py==${ACTIONLINT_VERSION}" actionlint -color

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      # Only the dev group (ruff and friends), not the ~150-package runtime set.
      # --locked fails the job when uv.lock no longer matches pyproject.toml,
      # instead of every other job silently re-locking it.
      - uses: ./.github/actions/setup-backend
        with:
          sync-args: --locked --only-group dev --no-install-project
      # The locked ruff (dev group), the same one `uv run ruff` uses locally.
      # `uvx ruff` would fetch whatever Ruff released last and could fail
      # unrelated PRs on a new rule.
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .

  discord-bot:
    name: Discord Bot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "bot/uv.lock"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  backend-test-unit:
    name: Backend Tests (unit)
    # Kept on release PRs as the unit smoke, but ubuntu-only there: the dynamic
    # matrix drops the (slow) Windows leg for a version-only change.
    needs: [detect-release]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.detect-release.outputs.os_matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-backend
        with:
          apt-packages: libsndfile1 ffmpeg
      - name: Run unit tests
        # Use bash + pipefail so pytest's exit code propagates through tee.
        # Git Bash is preinstalled on windows-latest runners.
        # Pre-existing failures are marked @pytest.mark.skip in the test
        # files themselves — see CONTRIBUTING.md "Known broken tests".
        shell: bash
        run: |
          set -o pipefail
          # Coverage is measured on Linux only: that is the leg whose data the
          # backend-coverage job combines, and tracing slows the Windows leg,
          # which is already the slowest job in the workflow.
          cov_args=()
          if [ "$RUNNER_OS" = "Linux" ]; then
            cov_args=(--cov=app --cov-report=term)
          fi
          uv run pytest tests/unit/ -v --tb=short "${cov_args[@]}" \
            -m "not requires_audio" 2>&1 | tee pytest-unit-output.txt
        env:
          DEBUG: "true"
      # Stash the raw coverage data (Linux only) so the backend-coverage job can
      # combine it with the integration run for a full-suite coverage gate.
      - name: Stash coverage data
        if: runner.os == 'Linux'
        run: mv .coverage .coverage.unit
      - name: Upload coverage data
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-unit
          path: backend/.coverage.unit
          include-hidden-files: true
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-unit-output-${{ matrix.os }}
          path: backend/pytest-unit-output.txt

  backend-test-integration:
    name: Backend Tests (integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Deliberately NOT `needs: backend-test-unit`. Nothing here consumes the
    # unit job's output, and waiting on it put the Windows unit leg (6-10 min)
    # in front of this job on every PR. Only backend-coverage needs both.
    needs: [detect-release]
    if: needs.detect-release.outputs.is_release != 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-backend
        with:
          apt-packages: libsndfile1 ffmpeg
      - name: Run integration + pipeline tests
        shell: bash
        run: |
          set -o pipefail
          uv run pytest tests/integration/ tests/pipeline/ -v --tb=long \
            --cov=app --cov-report=term 2>&1 | tee pytest-integration-output.txt
        env:
          DEBUG: "true"
      - name: Stash coverage data
        run: mv .coverage .coverage.integration
      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-integration
          path: backend/.coverage.integration
          include-hidden-files: true
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-integration-output
          path: backend/pytest-integration-output.txt

  backend-coverage:
    name: Backend Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-release, backend-test-unit, backend-test-integration]
    if: needs.detect-release.outputs.is_release != 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-backend
      # Both artifacts hold a single `.coverage.*` file; dropping them in the
      # working dir lets `coverage combine` merge unit + integration + pipeline.
      - name: Download unit coverage data
        uses: actions/download-artifact@v8
        with:
          name: coverage-data-unit
          path: backend
      - name: Download integration coverage data
        uses: actions/download-artifact@v8
        with:
          name: coverage-data-integration
          path: backend
      # Floor is set ~2pts below the measured full-suite line rate. It lives here
      # (not in pyproject's [coverage.report] fail_under) so that local subset
      # runs like `pytest --cov=app tests/unit/test_x.py` aren't failed by it.
      - name: Combine coverage and enforce floor
        run: |
          uv run coverage combine
          uv run coverage report --show-missing --fail-under=58
          uv run coverage xml
      - name: Upload combined coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml

  backend-smoke:
    name: Backend Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-backend
        with:
          apt-packages: libsndfile1 ffmpeg
      - name: Import app
        run: uv run python -c "from app.main import app; print('import OK')"
      - name: Boot and probe
        run: |
          uv run uvicorn app.main:app --port 8765 &
          UVICORN_PID=$!
          for i in {1..20}; do
            if curl -fsS http://localhost:8765/api/jobs; then
              echo
              echo "backend ready after ${i}s"
              kill $UVICORN_PID || true
              exit 0
            fi
            sleep 1
          done
          echo "backend never became ready"
          kill $UVICORN_PID || true
          exit 1
        env:
          DEBUG: "true"
          DATABASE_URL: "sqlite+aiosqlite:///./engram_smoke.db"

  dependency-resolution:
    name: Dependency Resolution (Python ${{ matrix.python }}, ${{ matrix.os }})
    # Reproduces the macOS source-install path so a too-new interpreter or a
    # missing platform wheel (e.g. onnxruntime) is caught before a user hits it.
    # Path-filtered (deps_changed) plus the weekly scheduled run; see
    # detect-release.
    needs: [detect-release]
    if: needs.detect-release.outputs.is_release != 'true' && needs.detect-release.outputs.deps_changed == 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # macos-14 images were retired on 2026-11-02 (runner-images#13518); the job
        # is cancelled at 1s there. release.yml already builds on macos-15.
        os: [ubuntu-latest, macos-15]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-backend
        with:
          python-version: ""
          sync-args: --no-install-project --python ${{ matrix.python }}

  dependency-resolution-py314-guard:
    name: Reject Python 3.14 (requires-python cap)
    # Regression guard for the source-install failure reported on r/MakeMKV:
    # onnxruntime has no cp314 wheel, so the requires-python upper bound must
    # keep uv off Python 3.14. If this job starts failing because uv sync
    # *succeeded* on 3.14, raise the cap and refresh this guard.
    needs: [detect-release]
    if: needs.detect-release.outputs.is_release != 'true' && needs.detect-release.outputs.deps_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-backend
        with:
          python-version: ""
          sync-args: none
      - name: uv sync must reject Python 3.14
        shell: bash
        run: |
          # If 3.14 can't be provisioned (network, indexing, uv version gap) the
          # guard can't run — skip rather than fail for an unrelated reason.
          if ! uv python install 3.14; then
            echo "Python 3.14 unavailable via uv — skipping guard."
            exit 0
          fi
          if uv sync --no-install-project --python 3.14; then
            echo "ERROR: uv sync unexpectedly succeeded on Python 3.14."
            echo "The requires-python cap (<3.14) is missing or onnxruntime now ships cp314 wheels."
            exit 1
          fi
          echo "OK: Python 3.14 correctly rejected by the requires-python cap."

  alembic-check:
    name: Alembic Migration Sanity
    needs: [detect-release]
    if: needs.detect-release.outputs.is_release != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-backend
      - name: Verify exactly one head (no orphan migrations)
        run: |
          uv run alembic heads
          HEADS=$(uv run alembic heads 2>/dev/null | grep -c "(head)" || true)
          echo "Found $HEADS head(s)"
          if [ "$HEADS" != "1" ]; then
            echo "Expected exactly 1 alembic head, got $HEADS"
            exit 1
          fi
      - name: Verify migration history is linear and importable
        run: uv run alembic history --verbose
      - name: Apply migrations on top of an initialized DB
        run: |
          uv run python -c "import asyncio; from app.database import init_db; asyncio.run(init_db())"
          uv run alembic current
          uv run alembic upgrade head
          uv run alembic current
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./engram_alembic.db"
      # Fatal: a model change without its migration fails here rather than at a
      # user's first startup. (It was advisory while the tree still had drift;
      # it has reported "No new upgrade operations detected" since.)
      - name: Check that current models match migration state
        run: uv run alembic check
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./engram_alembic.db"

  frontend-lint-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Check bundle size budget
        run: node scripts/check-bundle-size.mjs

  frontend-test-unit:
    name: Frontend Unit Tests
    needs: [detect-release]
    if: needs.detect-release.outputs.is_release != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:unit -- --coverage
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Normal runs take 8-9 min. The cap is for the failure mode where the app
    # is broken outright; playwright.config.ts also stops after maxFailures.
    timeout-minutes: 30
    # Not gated on frontend-lint-build: E2E runs against the Vite dev server,
    # not that job's build, so waiting on it only delayed the start.
    needs: [detect-release]
    if: needs.detect-release.outputs.is_release != 'true'
    # Playwright's own image: the browsers AND their system libraries are baked
    # in. The previous `npx playwright install-deps` ran apt-get on every run
    # (normally 0.7 min, once 37 min on a slow mirror) and needed a runner pin
    # whenever ubuntu-latest moved ahead of the WebKit build. The tag must equal
    # @playwright/test in frontend/package.json (pinned exactly there); Renovate
    # bumps both in one PR (the frontend-testing group). `--user 1001` is the
    # runner's uid, as Playwright's CI docs recommend, so Firefox does not
    # refuse a HOME owned by another user.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    env:
      # No setup-python in the container: uv provisions this interpreter.
      UV_PYTHON: "3.11"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      # No apt packages: the simulated E2E backend only logs a warning without
      # ffmpeg, and soundfile's wheel bundles libsndfile.
      - uses: ./.github/actions/setup-backend
        with:
          python-version: ""
      - name: Install frontend dependencies
        run: npm ci
      # A clear failure for the one way this setup drifts: package-lock moved
      # @playwright/test without the image tag (or the reverse), so the browser
      # builds this Playwright expects are not the ones in the image.
      - name: Browsers in the image match @playwright/test
        shell: bash
        run: |
          npx playwright --version
          locations=$(npx playwright install --dry-run chromium firefox webkit | awk '/Install location:/ {print $3}')
          if [ -z "$locations" ]; then
            echo "::warning::Could not read browser locations from 'playwright install --dry-run'; skipping the image check."
            exit 0
          fi
          missing=0
          while read -r dir; do
            if [ ! -d "$dir" ]; then
              echo "::error::$dir is not in the container image."
              missing=1
            fi
          done <<< "$locations"
          if [ "$missing" = "1" ]; then
            echo "::error::@playwright/test and the E2E container image tag in ci.yml are out of step; move them together."
            exit 1
          fi
      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: "true"
          DEBUG: "true"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: frontend/test-results/

  # Build the PyInstaller bundle the way release.yml does and BOOT it. The
  # existing backend-smoke job boots from source, where dynamic imports resolve
  # at runtime; only a frozen bundle exercises PyInstaller's static analysis.
  # Gap this closes: scipy 1.17.1 (a Renovate lock bump, PR #570) moved its
  # vendored array_api_compat, PyInstaller's hook still named the old path, the
  # unresolved hidden import degraded to a WARNING in a ~90k-line log, and
  # v0.29.0 / v0.30.0 / v0.31.0 all shipped a binary that died on startup.
  # Path-filtered by detect-release so normal PRs pay nothing.
  frozen-build:
    name: Frozen Build Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [detect-release]
    if: needs.detect-release.outputs.build_relevant == 'true'
    steps:
      - uses: actions/checkout@v6

      # Frontend build + bundle, mirroring release.yml: engram.spec expects the
      # static assets at app/static, and a missing bundle changes what is frozen.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Bundle frontend
        run: cp -r frontend/dist backend/app/static

      - uses: ./.github/actions/setup-backend
        with:
          apt-packages: libsndfile1 ffmpeg
      - name: Install PyInstaller
        working-directory: backend
        # Same pins as release.yml. These MUST match: the point of this job is
        # to reproduce the release bundle, and an unpinned toolchain here would
        # test a different bundler than the one that ships.
        run: uv pip install "pyinstaller==6.20.0" "pyinstaller-hooks-contrib==2026.5"
      - name: Fetch fpcalc (bundled audio fingerprinter)
        working-directory: backend
        run: uv run python scripts/fetch_fpcalc.py

      - name: Build executable
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          uv run pyinstaller engram.spec 2>&1 | tee pyinstaller-build.log

      # Diffs every unresolved hidden import against a checked-in baseline and
      # fails on anything new. Lives in a script so it can be shellchecked and
      # run against a saved build log locally, rather than as unquotable YAML.
      - name: Check for new unresolved hidden imports
        working-directory: backend
        run: scripts/check_hidden_imports.sh pyinstaller-build.log

      # Same script release.yml runs, so PR-time and release-time assertions
      # cannot drift. Executed directly (not via `bash <script>`) so a lost
      # executable bit fails here rather than at release time.
      - name: Smoke test built executable
        env:
          PORT: "8765"
          HOST: "127.0.0.1"
        run: backend/scripts/smoke_test_frozen.sh backend/dist/engram/engram

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frozen-build-logs
          path: |
            backend/pyinstaller-build.log
            backend/build/engram/warn-engram.txt
            backend/found.txt
            backend/known.txt
            smoke-stdout.log
            smoke-stderr.log
          if-no-files-found: ignore

  # Single required status check for branch protection. `needs:` every granular
  # job and reports one pass/fail, so the individual jobs can be made
  # non-required (and freely skipped on release PRs) without leaving a required
  # context stuck in "Expected — waiting" → PR BLOCKED. Uses `always()` so it
  # runs even when upstream jobs were skipped or failed. A *skipped* job is
  # acceptable (intentionally skipped on a release-only change); only a
  # *failed/cancelled* job fails the gate.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - detect-release
      - changelog-version-check
      - workflow-lint
      - backend-lint
      - discord-bot
      - backend-test-unit
      - backend-test-integration
      - backend-coverage
      - backend-smoke
      - dependency-resolution
      - dependency-resolution-py314-guard
      - alembic-check
      - frontend-lint-build
      - frontend-test-unit
      - e2e-tests
      - frozen-build
    steps:
      - name: Gate on needed jobs (skipped is OK, failed/cancelled is not)
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS_JSON"
          bad=$(printf '%s' "$NEEDS_JSON" | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          bad = [k for k, v in needs.items() if v.get("result") in ("failure", "cancelled")]
          print(",".join(bad))
          ')
          if [ -n "$bad" ]; then
            echo "CI Gate FAILED — failed/cancelled jobs: $bad"
            exit 1
          fi
          echo "CI Gate PASSED."
