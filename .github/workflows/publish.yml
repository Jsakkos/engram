name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  id-token: write

env:
  # Pinned so a uv release cannot change behaviour unannounced; Renovate bumps it.
  # renovate: datasource=github-releases depName=astral-sh/uv
  UV_VERSION: "0.13.9"

jobs:
  publish:
    if: false  # Disabled for initial release — enable when PyPI publishing is ready
    name: Publish Package
    runs-on: ubuntu-latest
    environment: pypi
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build package
        run: uv build
      - name: Publish to PyPI
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
