[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

markers =
    unit: Unit tests (isolated components)
    integration: Integration tests (multiple components)
    pipeline: Fixture-based pipeline tests using disc snapshots (CI-safe)
    slow: Slow-running tests
    real_data: Tests requiring real ripped MKV files on disk (local-only)
    live: Tests that make real HTTP calls to third-party subtitle providers (opt-in via ENGRAM_LIVE_PROVIDER_TESTS=1)
    # Must stay in sync with backend/pytest.ini: running `pytest tests/unit/` makes
    # pytest 9.2 pick THIS file as the config (nearest ancestor of the args), and
    # --strict-markers below then rejects `-m "not requires_audio"` in CI.
    requires_audio: Tests that require libsndfile/ffmpeg system libraries (Linux-only in CI)

addopts =
    --verbose
    --strict-markers
    --tb=short

log_cli = true
log_cli_level = INFO
